<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <title>דף פרטי ומוצפן</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f8fafc;
      color: #0f172a;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      padding: 24px;
    }
    .gate {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 32px 28px;
      text-align: center;
      box-shadow: 0 18px 40px -20px rgba(15, 23, 42, 0.14);
    }
    .lock { font-size: 2.2rem; margin-bottom: 10px; }
    h1 { margin: 0 0 8px; font-size: 1.35rem; font-weight: 700; }
    p { margin: 0 0 18px; color: #475569; font-size: 0.95rem; line-height: 1.6; }
    .row { display: flex; gap: 8px; }
    input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.92rem;
      direction: ltr;
      text-align: left;
    }
    button {
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: #ffffff;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    .err { color: #dc2626; font-size: 0.88rem; margin-top: 12px; min-height: 1.2em; }
  </style>
</head>
<body>
  <main class="gate" id="gate">
    <div class="lock">🔒</div>
    <h1 id="status-title">מפענח תוכן מוצפן...</h1>
    <p id="status-desc">התוכן מוגן בהצפנת AES-256-GCM מקצה לקצה וזמין רק דרך הקישור המלא עם מפתח הפענוח.</p>
    <div class="row" id="manual-row" style="display:none;">
      <input type="password" id="key-input" placeholder="הדבק מפתח פענוח" autocomplete="off" />
      <button type="button" id="unlock-btn">פתח</button>
    </div>
    <div class="err" id="err-msg"></div>
  </main>

  <script>
    function b64UrlToBytes(str) {
      let s = (str || '').trim().replace(/-/g, '+').replace(/_/g, '/');
      while (s.length % 4) s += '=';
      const bin = atob(s);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    function getKeyFromUrl() {
      const h = (window.location.hash || '').replace(/^#/, '');
      const m = h.match(/(?:^|&)k=([^&]+)/i);
      if (m) return decodeURIComponent(m[1]);
      if (h && !h.includes('=') && h.length >= 32) return decodeURIComponent(h);
      return '';
    }

    async function decryptAndRender(rawKey) {
      const errEl = document.getElementById('err-msg');
      const titleEl = document.getElementById('status-title');
      const rowEl = document.getElementById('manual-row');
      errEl.textContent = '';

      if (!rawKey) {
        titleEl.textContent = 'תוכן פרטי ומוצפן';
        rowEl.style.display = 'flex';
        return;
      }

      try {
        titleEl.textContent = 'מפענח בצורה מאובטחת...';
        const keyBytes = b64UrlToBytes(rawKey);
        if (keyBytes.length !== 32) throw new Error('BAD_KEY_LEN');
        const cryptoKey = await crypto.subtle.importKey('raw', keyBytes, { name: 'AES-GCM' }, false, ['decrypt']);
        const res = await fetch('./vault.bin?v=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('FETCH_FAIL');
        const buf = new Uint8Array(await res.arrayBuffer());
        const iv = buf.slice(0, 12);
        const ctAndTag = buf.slice(12);
        const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, cryptoKey, ctAndTag);
        const html = new TextDecoder().decode(plainBuf);
        document.open();
        document.write(html);
        document.close();
      } catch (e) {
        titleEl.textContent = 'תוכן פרטי ומוצפן';
        rowEl.style.display = 'flex';
        errEl.textContent = 'מפתח הפענוח חסר או שגוי. נדרש הקישור המלא.';
      }
    }

    document.getElementById('unlock-btn').addEventListener('click', () => {
      decryptAndRender(document.getElementById('key-input').value);
    });
    document.getElementById('key-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') decryptAndRender(e.target.value);
    });

    decryptAndRender(getKeyFromUrl());
  </script>
</body>
</html>
